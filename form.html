    <div class="container">
        <header>
            <h1>Form Biodata</h1>
            <div class="nim">Isi data diri di bawah ini</div>
        </header>

        <div class="main-content single-column">
            <section class="card">
                <div class="card-header">
                    <h2>Form Input Mahasiswa</h2>
                </div>

                <form id="biodataForm" class="form-grid">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" name="nama" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group full">
                        <label for="jurusan">Jurusan</label>
                        <select id="jurusan" name="jurusan" required>
                            <option value="">Pilih jurusan</option>
                            <option value="Informatika">Informatika</option>
                            <option value="Sains Informasi ">Sains Informasi </option>
                            <option value="DKV">DKV</option>
                        </select>
                    </div>

                    <div class="form-group full">
                        <label for="pesan">Pesan</label>
                        <textarea id="pesan" name="pesan" rows="4" placeholder="Tulis pesan kamu..."></textarea>
                    </div>

                    <div class="form-group full">
                        <button type="submit" class="btn-primary">Kirim Data</button>
                    </div>
                </form>

                <div id="formResult" class="result-box"></div>
            </section>
        </div>

        <footer>
            <p>&copy; 2026 Ni Luh Putu Eka Mulianingsih.</p>
        </footer>
    </div>

    <script src="script.js"></script>
